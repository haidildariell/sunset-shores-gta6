<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sunset Shores — an original open-world crime game in Palmera Bay. Steal cars, outrun the Palmera PD, run eight jobs for Mara Quinn, and vanish into the sunset.">
<meta name="application-name" content="Sunset Shores">
<meta name="theme-color" content="#1a1210">
<title>Sunset Shores — Open World Crime in Palmera Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  noscript p { color: #fff; font: 16px sans-serif; text-align: center; padding-top: 40vh; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunset Shores: an open-world crime game. Explore Palmera Bay on foot and by car, steal cars, boost with nitro, handbrake through corners, switch between pistol, shotgun and SMG, outrun the police, and run eight missions for Mara Quinn."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p>Sunset Shores needs JavaScript to run. Please enable it and reload.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
